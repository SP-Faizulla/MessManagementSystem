<!doctype html>
<html>
<head>
  <title>Change Password</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #43cea2, #185a9d);
    }

    .box {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 320px;
    }

    h2 {
      margin-bottom: 20px;
      color: #185a9d;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #43cea2;
      box-shadow: 0 0 5px rgba(67, 206, 162, 0.5);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #185a9d, #43cea2);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      color: #185a9d;
      font-size: 14px;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="box">
    <h2>Change Password</h2>

    <form method="POST">
      <input type="password" name="new_password" placeholder="Enter new password" required>
      <button type="submit">Send Request</button>
    </form>

    <a href="/student" class="back">⬅ Back to Dashboard</a>
  </div>

</body>
</html>
