<!doctype html>
<html>
<head>
  <title>Password Requests</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      color: #fff;
      text-align: center;
    }

    h2 {
      padding: 30px 0 10px;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      color: #333;
      padding: 15px 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    }

    .text {
      font-size: 15px;
      font-weight: 500;
    }

    .actions a {
      text-decoration: none;
      padding: 6px 12px;
      margin-left: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      transition: 0.3s;
    }

    .approve {
      background: #28a745;
      color: white;
    }

    .approve:hover {
      background: #218838;
      transform: scale(1.05);
    }

    .reject {
      background: #dc3545;
      color: white;
    }

    .reject:hover {
      background: #c82333;
      transform: scale(1.05);
    }

    .empty {
      margin-top: 30px;
      font-size: 18px;
      opacity: 0.8;
    }

    .back {
      display: inline-block;
      margin: 30px 0;
      padding: 10px 20px;
      background: white;
      color: #2575fc;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .back:hover {
      transform: scale(1.05);
    }

  </style>
</head>

<body>

  <h2>🔐 Password Requests</h2>

  <div class="container">

    {% if requests %}
      {% for r in requests %}
      <div class="card">
        <div class="text">
          <b>{{ r[1] }}</b> wants to change password
        </div>

        <div class="actions">
          <a href="/approve_password/{{ r[0] }}" class="approve">Approve</a>
          <a href="/reject_password/{{ r[0] }}" class="reject">Reject</a>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <p class="empty">No pending requests</p>
    {% endif %}

  </div>

  <a href="/admin" class="back">⬅ Back to Dashboard</a>

</body>
</html>
